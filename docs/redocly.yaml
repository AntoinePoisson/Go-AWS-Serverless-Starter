# Lives here rather than at the root: everything it governs is in this
# directory, and the root already has enough tool config. Callers pass
# --config, see the lint task in tasks/docs.yml.
#
# Lint only. Render flags sit on the build-docs call in tasks/docs.yml
# so the whole pipeline reads in one place.
#
# A few rules are warnings so the gate is "is the spec valid", not
# "is every annotation filled in". Promote them once they are.
extends:
  - recommended

apis:
  main:
    root: openapi.yaml

rules:
  # An operation that forgot @Security would look open. Open routes are
  # listed one by one so opening one is a decision written down here.
  # swag cannot emit `security: []`, so no annotation for those.
  security-defined:
    severity: error
    exceptions:
      - path: /health
        methods: [get]
      - path: /public/items/{id}
        methods: [get]

  operation-operationId-unique: error
  no-invalid-media-type-examples: error

  # Licence of the project built from the template, not of the template.
  # Declare it in docs/openapi.go and turn this into an error.
  info-license: warn

  operation-summary: warn
  operation-description: warn

  # /health answers 200 or nothing, there is no 4xx to document
  operation-4xx-response: warn

  # localhost:8080 and :8081 are what `make run-api` binds to
  no-server-example.com: warn
