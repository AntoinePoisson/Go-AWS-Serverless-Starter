# Redocly configuration. It lives here rather than at the repository root
# because everything it governs is in this directory, and the root already
# carries enough tool configuration. Every caller passes --config, see the lint
# task in tasks/docs.yml.
#
# Only linting is configured here. The rendering options are flags on the
# build-docs call in tasks/docs.yml, so the whole pipeline reads in one place.
#
# Some rules are downgraded to warnings, so the gate is the validity of the
# spec rather than its completeness. Promote them back as annotations fill in.
extends:
  - recommended

apis:
  main:
    root: openapi.yaml

rules:
  # An operation that forgot @Security would document itself as open, hence the
  # error. Open routes are listed one by one so that opening one is a decision
  # written down here. swag cannot emit `security: []`, so no annotation.
  security-defined:
    severity: error
    exceptions:
      - path: /health
        methods: [get]
      - path: /public/items/{id}
        methods: [get]

  operation-operationId-unique: error
  no-invalid-media-type-examples: error

  # The licence is the one of the project built from the template, not of the
  # template. Declare it in docs/openapi.go and turn this into an error.
  info-license: warn

  operation-summary: warn
  operation-description: warn

  # /health answers 200 or nothing, there is no 4xx to document
  operation-4xx-response: warn

  # localhost:8080 and :8081 are what `make run-api` binds to
  no-server-example.com: warn
