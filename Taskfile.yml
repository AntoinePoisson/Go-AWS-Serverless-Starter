version: "3"

includes:
  build: ./tasks/build.yml
  clean: ./tasks/clean.yml
  demo: ./tasks/demo.yml
  deploy: ./tasks/deploy.yml
  docs: ./tasks/docs.yml
  local: ./tasks/local.yml
  wire: ./tasks/wire.yml

tasks:
  default:
    cmds:
      - task --list
    silent: true

  tidy:
    desc: Sync go.mod and go.sum
    cmds:
      - go mod tidy

  fmt:
    desc: Format the Go sources and the OpenAPI annotations
    cmds:
      - go tool golangci-lint fmt

  lint:
    # no separate `go vet`, govet is part of the set in .golangci.yml
    desc: Run golangci-lint
    cmds:
      - go tool golangci-lint run ./...

  test:
    desc: Run the unit tests with coverage
    # -coverpkg to match what CI measures
    cmds:
      - mkdir -p .coverage
      - go test -race -coverpkg=./... -coverprofile=.coverage/report.out ./...

  test:integration:
    desc: Run the integration tests against DynamoDB Local
    dotenv: [".env", ".env.example"]
    deps: [local:db]
    cmds:
      - go test -tags=integration -count=1 ./internal/item/...

  coverage:
    desc: Open the coverage report in a browser
    deps: [test]
    cmds:
      - go tool cover -html=.coverage/report.out

  coverage:check:
    desc: Fail if the hand-written code is below the coverage floor
    deps: [test]
    vars:
      FLOOR: 80
    cmds:
      # Injectors, mocks and main() come out first. Nothing in them is worth a
      # test and their weight would hide the code that is. The `mode:` line
      # matches none of the patterns so it survives the filter.
      - |
        set -eu
        grep -v -e 'wire_gen\.go:' -e '/mock_' -e '/main\.go:' \
          .coverage/report.out > .coverage/handwritten.out
        total=$(go tool cover -func=.coverage/handwritten.out | awk '/^total:/ {print $NF}' | tr -d '%')
        echo "hand-written code: $total% covered, floor {{ .FLOOR }}%"
        awk -v t="$total" -v f={{ .FLOOR }} 'BEGIN { exit (t + 0 >= f + 0) ? 0 : 1 }' || {
          echo "coverage is below the floor, write the missing tests"
          exit 1
        }
