# Git hooks, installed by `npm install`. Fast checks on commit, the real ones
# on push. Anything that rewrites a file runs in a piped group so two commands
# never touch the same *.go at once.
skip:
  - merge
  - rebase

pre-commit:
  parallel: true

  jobs:
    # format then lint, never concurrently, both rewrite the same files
    - name: go
      glob: "*.go"
      group:
        piped: true
        jobs:
          - name: format
            run: go tool golangci-lint fmt {staged_files}
            stage_fixed: true

          # Everything plus godox on the protected branches, new issues only
          # elsewhere, so inherited problems dont block the fix at hand.
          - name: lint
            run: |
              set -eu
              # --show-current and not rev-parse HEAD, which points at no
              # revision on the initial commit
              branch=$(git branch --show-current)

              case "$branch" in
              dev | main | prod)
                echo "strict lint on $branch"
                go tool golangci-lint run --fix --enable=godox ./...
                ;;
              *)
                dirs=$(printf '%s\n' {staged_files} | xargs -n1 dirname | sort -u)

                # no remote ref means no usable merge base
                for candidate in origin/dev origin/main; do
                  if git rev-parse --verify --quiet "$candidate" >/dev/null; then
                    echo "incremental lint on $branch (new issues since $candidate)"
                    # shellcheck disable=SC2086
                    exec go tool golangci-lint run --fix --new-from-merge-base="$candidate" $dirs
                  fi
                done

                echo "no upstream branch to compare against, linting the staged packages"
                # shellcheck disable=SC2086
                go tool golangci-lint run --fix $dirs
                ;;
              esac
            stage_fixed: true

    # Index check only, regeneration happens at pre-push. This catches staging
    # a generator input without its output.
    - name: generated-staged
      run: |
        set -eu
        staged=$(git diff --cached --name-only --diff-filter=ACMR)
        fail=0

        note() {
          printf '  %s\n' "$1" >&2
          fail=1
        }

        # an interface changed but its mock did not. same scope as `make mocks`
        for f in $(printf '%s\n' "$staged" | grep -E '^(internal|lambda)/.*api\.go$' | grep -v '/mock_' || true); do
          dir=$(dirname "$f")
          mock="$dir/mock_$(basename "$dir")/mock$(basename "$f")"
          printf '%s\n' "$staged" | grep -qxF "$mock" || note "$f is staged, $mock is not - run 'make mocks'"
        done

        # the dependency graph changed but the injector did not
        for f in $(printf '%s\n' "$staged" | grep -E 'lambda/[^/]+/wire\.go$' || true); do
          gen="$(dirname "$f")/wire_gen.go"
          printf '%s\n' "$staged" | grep -qxF "$gen" || note "$f is staged, $gen is not - run 'make wire'"
        done

        # an annotation changed but the spec did not
        if git diff --cached -U0 -- '*.go' | grep -qE '^\+[[:space:]]*//[[:space:]]*@(Router|Success|Failure|Param|Header|Security|Id|Tags|Summary|Description|Accept|Produce|title|version|servers|tag|securityDefinitions)'; then
          printf '%s\n' "$staged" | grep -qxF 'docs/openapi.yaml' || note "a swag annotation changed but docs/openapi.yaml is not staged - run 'make docs'"
        fi

        [ "$fail" -eq 0 ] || exit 1
        echo "generated files are consistent with what is staged"

    - name: tidy
      glob: "go.{mod,sum}"
      run: go mod tidy -diff

# Everything here also runs in CI. Not parallel, the first group rewrites the
# tree the second one compiles. Through `make` and not `task`, the Makefile
# falls back to `go run` on a fresh clone.
pre-push:
  piped: true

  jobs:
    # sequential: mockgen writes files wire reads, and swag parses both
    - name: generated
      group:
        piped: true
        jobs:
          - name: wire
            run: make wire
          - name: mocks
            run: make mocks
          - name: openapi
            run: make docs-check
          - name: drift
            run: |
              git diff --exit-code -- 'lambda/*/wire_gen.go' 'internal/**/mock_*' 'lambda/**/mock_*' docs/openapi.yaml || {
                echo ""
                echo "generated files were out of date and have just been rewritten."
                echo "review the diff, 'git add' it, amend or commit, then push again."
                exit 1
              }

    # safe in parallel, nothing here writes a source file
    - name: verify
      group:
        parallel: true
        jobs:
          - name: build
            run: make build-host
          - name: test
            run: make test

commit-msg:
  jobs:
    - name: commitlint
      run: ./node_modules/.bin/commitlint --edit {1}
