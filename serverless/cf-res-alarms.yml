# Alarms on the HTTP API rather than on the functions, so that the failures no
# handler ever sees (integration timeout, throttled or crashed Lambda, bad
# response payload) trip it too.
Resources:
  # No subscription here on purpose, an address belongs to whoever runs the
  # stage. Subscribe to the ARN once and later alarms publish to the same topic.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ${self:service}-${self:provider.stage}-alarms
      DisplayName: ${self:service} ${self:provider.stage}

  # `5xx` is the HTTP API metric, a REST API publishes `5XXError` instead.
  # Getting it wrong deploys fine and sits in INSUFFICIENT_DATA forever.
  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ${self:service}-${self:provider.stage}-api-5xx
      AlarmDescription: >-
        ${self:service} ${self:provider.stage} answered
        ${self:custom.stage.api5xxThreshold} or more 5xx in five minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: ${self:custom.stage.api5xxThreshold}
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # otherwise a quiet stage reports INSUFFICIENT_DATA
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      # notified on the way back too
      OKActions:
        - !Ref AlarmTopic

Outputs:
  AlarmTopicArn:
    Description: Topic the alarms publish to, subscribe to it to be notified
    Value: !Ref AlarmTopic
