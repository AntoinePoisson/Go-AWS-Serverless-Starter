# The one alarm an API cannot do without: the stack answering 5xx. It watches
# the HTTP API rather than the functions, so the failures no handler ever sees -
# an integration timeout, a throttled or crashed Lambda, a bad response payload
# - trip it too.
Resources:
  # Created empty on purpose: an address belongs to whoever runs the stage, not
  # to the repository. Subscribe to the ARN below once, and every alarm added
  # later publishes to the same place.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ${self:service}-${self:provider.stage}-alarms
      DisplayName: ${self:service} ${self:provider.stage}

  # `5xx` is the metric name of an HTTP API; a REST API publishes `5XXError`
  # instead. Getting it wrong does not fail the deployment - it produces an
  # alarm that sits in INSUFFICIENT_DATA forever, which is worse than no alarm.
  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ${self:service}-${self:provider.stage}-api-5xx
      AlarmDescription: >-
        ${self:service} ${self:provider.stage} answered
        ${self:custom.stage.api5xxThreshold} or more 5xx in five minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: ${self:custom.stage.api5xxThreshold}
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # An API nobody called is not an API in trouble: without this the alarm
      # would report INSUFFICIENT_DATA on every quiet stage.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      # Notified on the way back too - an alarm nobody sees recover is an alarm
      # someone keeps chasing.
      OKActions:
        - !Ref AlarmTopic

Outputs:
  AlarmTopicArn:
    Description: Topic the alarms publish to, subscribe to it to be notified
    Value: !Ref AlarmTopic
