# Alarms on the HTTP API, not the functions, so the failures no handler
# ever sees (timeout, throttle, crash, bad payload) trip it too.
Resources:
  # TODO: subscribe whoever owns the stage. An address doesn't belong in the template.
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: ${self:service}-${self:provider.stage}-alarms
      DisplayName: ${self:service} ${self:provider.stage}

  # `5xx` is the HTTP API metric. A REST API publishes `5XXError` instead.
  # Get it wrong and it deploys fine, then sits in INSUFFICIENT_DATA forever.
  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ${self:service}-${self:provider.stage}-api-5xx
      AlarmDescription: >-
        ${self:service} ${self:provider.stage} answered
        ${self:custom.stage.api5xxThreshold} or more 5xx in five minutes.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: ${self:custom.stage.api5xxThreshold}
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # otherwise a quiet stage reports INSUFFICIENT_DATA
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      # notified on the way back too
      OKActions:
        - !Ref AlarmTopic

Outputs:
  AlarmTopicArn:
    Description: Topic the alarms publish to, subscribe to it to be notified
    Value: !Ref AlarmTopic
