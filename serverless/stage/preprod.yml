region: eu-west-1
logLevel: info
logRetentionInDays: 14
pointInTimeRecovery: true

# in between. releases are rehearsed here
api5xxThreshold: 5

# same as prod, so a release is rehearsed under the same constraints
tableDeletionPolicy: Retain

# replace with the origins allowed to call the API
corsOrigins:
  - https://example.com

# From SSM. DEPLOY_API_KEY overrides it so `make package` can render
# without AWS credentials.
apiKey: ${env:DEPLOY_API_KEY, ssm:/${self:service}/preprod/api-key}
