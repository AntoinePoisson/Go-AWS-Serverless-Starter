region: eu-west-1
logLevel: info
logRetentionInDays: 30
pointInTimeRecovery: true

# Kept when the stack is deleted, so `serverless remove` cannot drop the data.
tableDeletionPolicy: Retain

# Replace with the origins allowed to call the API. Never widen this to "*" on a
# stage holding real data.
corsOrigins:
  - https://example.com

# Read from SSM. Set DEPLOY_API_KEY to override, which also lets `make package`
# render the template without AWS credentials.
apiKey: ${env:DEPLOY_API_KEY, ssm:/${self:service}/prod/api-key}
