region: eu-west-1
logLevel: debug
logRetentionInDays: 7
pointInTimeRecovery: false

# loose, this is where broken code is expected to show up
api5xxThreshold: 10

tableDeletionPolicy: Delete

corsOrigins:
  - "*"

# From SSM. DEPLOY_API_KEY overrides it so `make package` can render without
# AWS credentials.
apiKey: ${env:DEPLOY_API_KEY, ssm:/${self:service}/alpha/api-key}
