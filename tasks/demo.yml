# Records the README GIF from docs/demo.tape.
#
# In a throwaway clone, never in place: the demo opens on `initialize.sh`, which
# rewrites the module path and the service name of the checkout it runs in.
version: "3"

vars:
  # Under bin/, which is git-ignored and what `make clean` removes.
  CLONE: bin/demo

tasks:
  gif:
    desc: Record docs/demo.gif from docs/demo.tape (needs vhs, gifsicle, Docker)
    preconditions:
      - sh: command -v vhs
        msg: vhs is not installed - `brew install vhs`
      - sh: command -v gifsicle
        msg: gifsicle is not installed - `brew install gifsicle`
      - sh: docker info >/dev/null 2>&1
        msg: Docker is not running - the demo starts DynamoDB Local
      # The clone starts its own container on the same port as yours.
      - sh: "! nc -z localhost 8000"
        msg: port 8000 is taken - run `make db-stop` first
    cmds:
      - rm -rf {{ .CLONE }}
      - git clone --quiet . {{ .CLONE }}
      # The tape from the working tree rather than from HEAD, so iterating on it
      # does not need a commit per take.
      - cp docs/demo.tape {{ .CLONE }}/docs/demo.tape
      - cd {{ .CLONE }} && vhs docs/demo.tape
      # VHS optimises for fidelity; a README wants a file people will wait for.
      - gifsicle -O3 --lossy=60 {{ .CLONE }}/docs/demo.gif -o docs/demo.gif
      - cd {{ .CLONE }} && docker compose down --volumes >/dev/null 2>&1 || true
      - rm -rf {{ .CLONE }}
      - ls -lh docs/demo.gif
      - echo 'Commit it, and make sure the README shows it - ![demo](docs/demo.gif)'
