version: "3"

vars:
  # The first directory must hold the -g file: swag resolves -g relatively to
  # it, not to the working directory. The rest are the packages carrying an
  # annotation or a type an annotation references.
  SWAG_DIRS: ./docs,./lambda/api/internal/handler/items,./lambda/public/internal/handler/health,./lambda/public/internal/handler/items,./internal/item,./internal/httpx

tasks:
  openapi:
    desc: Regenerate docs/openapi.yaml from the swag annotations
    sources:
      - docs/openapi.go
      - lambda/**/*.go
      - internal/item/*.go
      - internal/httpx/*.go
    generates:
      - docs/openapi.yaml
    cmds:
      # --parseInternal is mandatory: every type this API returns lives under
      # internal/, handlers included. Without it swag emits a specification with
      # no schemas at all, and no error.
      #
      # --parseDependency is deliberately absent: nothing here references an
      # external type (time.Time has a built-in mapping), and turning it on
      # would pull AWS SDK schemas into the document.
      - go tool swag init --v3.1 -ot yaml --parseInternal -g openapi.go -d {{.SWAG_DIRS}} -o docs
      # swag writes swagger.yaml whatever the specification version; the
      # deliverable is docs/openapi.yaml.
      - mv docs/swagger.yaml docs/openapi.yaml

  lint:
    desc: Validate docs/openapi.yaml with Redocly
    cmds:
      - npx --no-install redocly lint docs/openapi.yaml

  html:
    desc: Render docs/api.html from the specification
    deps: [openapi]
    cmds:
      - npx --no-install redocly build-docs docs/openapi.yaml -o docs/api.html

  check:
    desc: Fail if the committed specification is not what the code produces
    cmds:
      - task: openapi
      - |
        git diff --exit-code -- docs/openapi.yaml || {
          echo "docs/openapi.yaml does not match the annotations. Run 'make docs' and commit the result."
          exit 1
        }
