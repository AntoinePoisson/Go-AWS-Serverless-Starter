version: "3"

vars:
  # The first directory has to hold the -g file, swag resolves it relative to
  # that one and not to the working directory.
  SWAG_DIRS: ./docs,./lambda/api/internal/handler/items,./lambda/public/internal/handler/health,./lambda/public/internal/handler/items,./internal/item,./internal/httpx

tasks:
  openapi:
    desc: Regenerate docs/openapi.yaml from the swag annotations
    sources:
      - docs/openapi.go
      - lambda/**/*.go
      - internal/item/*.go
      - internal/httpx/*.go
    generates:
      - docs/openapi.yaml
    cmds:
      # --parseInternal is mandatory, every type we return lives under internal/
      # and without it swag emits no schema and no error either. Dont add
      # --parseDependency, it pulls in the AWS SDK for nothing.
      - go tool swag init --v3.1 -ot yaml --parseInternal -g openapi.go -d {{.SWAG_DIRS}} -o docs
      # swag writes swagger.yaml whatever the spec version
      - mv docs/swagger.yaml docs/openapi.yaml

  lint:
    desc: Validate docs/openapi.yaml with Redocly
    cmds:
      # --no-install: bare npx silently downloads the latest release instead of
      # failing when node_modules is missing. --config because the Redocly
      # configuration sits next to the spec rather than at the repository root.
      - npx --no-install redocly lint docs/openapi.yaml --config docs/redocly.yaml

  html:
    desc: Render docs/api.html from the specification
    deps: [openapi]
    cmds:
      # --theme options are applied during the server-side render, so they
      # land in the first paint instead of after hydration. No web font: the
      # Google Fonts stylesheet blocked rendering for ~1s and pulled two woff2
      # files onto the critical path for what the system stack already covers.
      # The colours are the ones the defaults get wrong on contrast, see
      # docs/template.hbs for the one case that has to stay CSS.
      - >-
        npx --no-install redocly build-docs docs/openapi.yaml
        --template docs/template.hbs
        --templateOptions.metaDescription="A production-minded Go starter for AWS Lambda, API Gateway and DynamoDB."
        --templateOptions.canonicalUrl="${DOCS_CANONICAL_URL:-https://antoinepoisson.github.io/Go-AWS-Serverless-Starter/}"
        --theme.openapi.theme.typography.fontFamily='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
        --theme.openapi.theme.typography.headings.fontFamily='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
        --theme.openapi.theme.typography.code.fontFamily='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace'
        --theme.openapi.theme.typography.code.color='#c62828'
        --theme.openapi.theme.typography.links.textDecoration=underline
        --theme.openapi.theme.colors.responses.error.tabTextColor='#e8615c'
        -o docs/api.html
      # Redocly emits the bundle as a render-blocking script even though the
      # page is already server-rendered. See the file for what it rewrites.
      - node docs/optimize-html.mjs docs/api.html

  check:
    desc: Fail if the committed specification is not what the code produces
    cmds:
      - task: openapi
      - |
        git diff --exit-code -- docs/openapi.yaml || {
          echo "docs/openapi.yaml does not match the annotations. Run 'make docs' and commit the result."
          exit 1
        }
