version: "3"

vars:
  STAGE: '{{ .STAGE | default "alpha" }}'

tasks:
  package:
    desc: Build the CloudFormation template without deploying (STAGE=alpha)
    deps: [build:dist]
    cmds:
      - npx serverless package --stage {{ .STAGE }}

  stack:
    desc: Deploy the whole stack (STAGE=alpha)
    deps: [build:dist]
    cmds:
      - npx serverless deploy --stage {{ .STAGE }}

  function:
    desc: Deploy a single function (NAME=api STAGE=alpha)
    requires:
      vars: [NAME]
    cmds:
      - task: build:one
        vars: { NAME: "{{ .NAME }}" }
      - npx serverless deploy function --function {{ .NAME }} --stage {{ .STAGE }}

  remove:
    desc: Delete the deployed stack (STAGE=alpha)
    prompt: Delete the {{ .STAGE }} stack?
    cmds:
      - npx serverless remove --stage {{ .STAGE }}
