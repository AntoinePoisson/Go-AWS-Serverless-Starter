# --no-install everywhere: on a clone with no node_modules, bare `npx
# serverless` downloads a v4 and deploys with it whatever frameworkVersion says.
version: "3"

vars:
  STAGE: '{{ .STAGE | default "alpha" }}'

# Task names resolve inside this file's namespace, so a bare `build:dist` would
# mean `deploy:build:dist`. The leading colon points at the root Taskfile.
tasks:
  package:
    desc: Build the CloudFormation template without deploying (STAGE=alpha)
    deps: [":build:dist"]
    cmds:
      - npx --no-install serverless package --stage {{ .STAGE }}

  stack:
    desc: Deploy the whole stack (STAGE=alpha)
    deps: [":build:dist"]
    cmds:
      - npx --no-install serverless deploy --stage {{ .STAGE }}

  function:
    desc: Deploy a single function (NAME=api STAGE=alpha)
    requires:
      vars: [NAME]
    cmds:
      - task: ":build:one"
        vars: { NAME: "{{ .NAME }}" }
      - npx --no-install serverless deploy function --function {{ .NAME }} --stage {{ .STAGE }}

  remove:
    desc: Delete the deployed stack (STAGE=alpha)
    prompt: Delete the {{ .STAGE }} stack?
    cmds:
      - npx --no-install serverless remove --stage {{ .STAGE }}
