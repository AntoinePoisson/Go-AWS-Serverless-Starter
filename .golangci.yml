# `make fmt` runs the formatters, `make lint` the linters.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused

  # godox is missing on purpose, CI and the hooks turn it on for the protected
  # branches only.
  enable:
    - bodyclose
    - copyloopvar
    - errorlint # internal/item/errors.go relies on errors.Is/As
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - sloglint
    - testifylint
    - unconvert
    - usetesting
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true

    gosec:
      excludes:
        - G404 # math/rand is not used for anything security related here

    revive:
      # exported keeps its defaults, checkPrivateReceivers would ask for a doc
      # comment on every ResponseWriter method of an unexported type
      rules:
        - name: exported
        - name: context-as-argument
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: indent-error-flow
        - name: range-val-in-closure
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration

    sloglint:
      no-mixed-args: true
      kv-only: true # slog.Info("msg", "key", value), no attribute helpers
      static-msg: true # the message is the event, values go in keys
      key-naming-case: snake # easier to query in CloudWatch Logs Insights

    testifylint:
      disable:
        # the recover test asserts on a truncated body, JSONEq cannot parse it
        - encoded-compare

    staticcheck:
      checks:
        - all
        - -ST1000 # a package comment everywhere is a library convention

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling

    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - errcheck
          - gosec
          - noctx

      # docs/ declares no symbol, only swag annotations
      - path: ^docs/
        linters:
          - revive

formatters:
  enable:
    - gci
    - gofumpt
    - swaggo # keeps the OpenAPI annotations aligned

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/AntoinePoisson/go-aws-serverless-starter)

    gofumpt:
      extra-rules: true
