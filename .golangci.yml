# One config for both commands: `make fmt` runs the formatters, `make lint` the
# linters. govet and staticcheck come with the standard set.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused

  enable:
    - errorlint
    - misspell
    - revive
    - unconvert

  settings:
    errcheck:
      check-type-assertions: true

    revive:
      rules:
        - name: exported
        - name: context-as-argument
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: indent-error-flow
        - name: unreachable-code
        - name: var-declaration

  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gci
    - gofumpt

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/antoinepoisson/bootstrap-go-aws)

    gofumpt:
      extra-rules: true
