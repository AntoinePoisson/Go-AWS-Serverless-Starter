name: CI

on:
  push:
    # dev -> alpha, main -> preprod, prod -> prod
    branches: [dev, main, prod]
  pull_request:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy once every check passes
        type: choice
        options: [alpha, preprod, prod]
        default: alpha

permissions:
  contents: read

# Don't cancel a push. A killed deploy leaves CloudFormation mid-update.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # go.mod is the source of truth. Bump it when we want a stdlib fix.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # --diff, so CI never rewrites the tree it's judging
      - name: Verify the formatting
        run: |
          go tool golangci-lint fmt --diff || {
            echo "::error::sources are not formatted. Run 'make fmt' and commit the result."
            exit 1
          }

      # godox is off in .golangci.yml. we turn it on here, same as the hook on main.
      - name: Run golangci-lint
        run: go tool golangci-lint run --enable=godox ./...

      # Pinned in go.mod, Dependabot bumps it. The vuln DB is fetched at runtime anyway.
      - name: Check the dependencies for known vulnerabilities
        run: make vuln

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Floor lives in the Taskfile. make cover runs the suite then checks it.
      - name: Run the unit tests and enforce the coverage floor
        run: make cover

      - name: Upload the coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: .coverage/report.out
          retention-days: 7
          if-no-files-found: ignore

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # the suite creates its own table
      - name: Run the repository integration tests
        run: go test -tags=integration -count=1 ./internal/item/...

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # flags for the shipped zips live in tasks/build.yml
      - name: Compile and package both functions for Lambda (linux/arm64)
        run: make build

      - name: Upload the Lambda artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lambda-artifacts
          path: bin/dist/*.zip
          retention-days: 7

  test-e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      STAGE: ci
      ITEMS_TABLE: go-aws-serverless-starter-ci-items
      API_KEY: ci-key
      E2E_API_KEY: ci-key
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the Playwright dependencies
        run: npm --prefix e2e ci

      - name: Type-check the test suite
        run: npm --prefix e2e run typecheck

      - name: Create the items table in DynamoDB Local
        run: go run ./tools/localdb

      # Playwright starts both functions and waits for the ports, see
      # e2e/playwright.config.ts
      - name: Run the Playwright tests
        run: npm --prefix e2e test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/reports
          retention-days: 7
          if-no-files-found: ignore

  # Spec is generated from annotations, easy to forget to commit.
  openapi:
    name: API Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the documentation tooling
        run: npm ci

      # regenerates and diffs. swag invocation is in tasks/docs.yml
      - name: Fail if the committed specification is stale
        run: make docs-check

      # --config path lives in tasks/docs.yml
      - name: Lint the specification
        run: make docs-lint

      - name: Render the reference
        run: make docs

      # api.html is gitignored, this is how you read it for a given commit
      - name: Upload the rendered reference
        uses: actions/upload-artifact@v7
        with:
          name: api-reference
          path: docs/api.html
          retention-days: 7

  infra:
    name: Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the Serverless Framework
        run: npm ci

      # Runtime deps only. The Serverless CLI is archived and noisy, but it
      # never ships to AWS (we send Go binaries). govulncheck covers prod.
      - name: Audit the runtime dependencies
        run: npm run audit

      - name: Download the Lambda artifacts
        uses: actions/download-artifact@v8
        with:
          name: lambda-artifacts
          path: bin/dist

      # catches route collisions and unresolved vars before a deploy does
      - name: Render the CloudFormation template of every stage
        run: |
          for stage in alpha preprod prod; do
            echo "::group::$stage"
            npx --no-install serverless package --stage "$stage"
            echo "::endgroup::"
          done
        env:
          DEPLOY_API_KEY: rendered-in-ci

  # Picks the stage + version. PRs skip this, so they never hit AWS.
  resolve:
    name: Resolve Target
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
          && contains(fromJSON('["dev","main","prod"]'), github.ref_name))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage: ${{ steps.target.outputs.stage }}
      version: ${{ steps.target.outputs.version }}
      enabled: ${{ steps.target.outputs.enabled }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # A job, not an expression: we want exit 1 on an unknown ref, not a silent default.
      - name: Resolve the stage and the version
        id: target
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.stage }}" ]; then
            stage="${{ inputs.stage }}"
          else
            case "${{ github.ref_name }}" in
            dev)  stage=alpha   ;;
            main) stage=preprod ;;
            prod) stage=prod    ;;
            *) echo "::error::no stage is mapped to ref ${{ github.ref_name }}"; exit 1 ;;
            esac
          fi

          # /health reports this. We deploy before we tag, so git describe would
          # still show the previous release. The manifest already has the new one
          # once a release PR lands. alpha and preprod share it (dev is upstream of main).
          manifest=.release-please-manifest-preprod.json
          [ "$stage" = prod ] && manifest=.release-please-manifest-prod.json

          if [ -f "$manifest" ]; then
            base=$(jq -r '.["."]' "$manifest")
          else
            # No Release Please yet, or someone dropped it.
            base=0.0.0
            echo "::warning::$manifest is missing, reporting $base as the base version"
          fi

          # +build metadata. SemVer ignores it for ordering.
          version="${base}+${GITHUB_SHA::7}"

          # Deploy is opt-in on a fresh clone. Still resolve so the run says
          # what it would have shipped.
          if [ "${DEPLOY_ENABLED:-}" = "true" ]; then
            enabled=true
            echo "Deploying **$stage** as \`$version\`" >> "$GITHUB_STEP_SUMMARY"
          else
            enabled=false
            echo "::notice::deployment is disabled; set the DEPLOY_ENABLED repository variable to 'true' to deploy $stage"
            {
              echo "### Deployment disabled"
              echo
              echo "\`$stage\` would have shipped as \`$version\`."
              echo
              echo "Set the \`DEPLOY_ENABLED\` repository variable to \`true\`, along"
              echo "with the \`AWS_REGION\` variable and the \`AWS_DEPLOY_ROLE_ARN\`"
              echo "secret, to deploy and release from this repository."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "stage=$stage"     >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ needs.resolve.outputs.stage }}
    # Just the switch resolve computed. No always(): a green build + red tests
    # is exactly what we dont want shipped. Shorten the list if alpha feels
    # slow, dont drop it.
    if: needs.resolve.outputs.enabled == 'true'
    needs: [resolve, lint, test-unit, test-integration, openapi, build, test-e2e, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.resolve.outputs.stage }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-${{ needs.resolve.outputs.stage }}
      cancel-in-progress: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the Serverless Framework
        run: npm ci

      # the zips the checks already ran against, not a fresh build
      - name: Download the Lambda artifacts
        uses: actions/download-artifact@v8
        with:
          name: lambda-artifacts
          path: bin/dist

      - name: Assume the deployment role through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy the stack
        run: npx --no-install serverless deploy --stage "$STAGE"
        env:
          STAGE: ${{ needs.resolve.outputs.stage }}
          VERSION: ${{ needs.resolve.outputs.version }}

  # Deploy first, then release. Two configs because both branches write the
  # top of a changelog and a shared file would conflict every time.
  # Dont auto-merge the release PRs: GITHUB_TOKEN pushes skip workflows,
  # so the tag would never actually deploy.
  release-preprod:
    name: Release Preprod
    # success() already implies this, but this is where people look.
    if: >-
      github.event_name == 'push'
      && github.ref_name == 'main'
      && needs.deploy.result == 'success'
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      # pre-releases sort below the matching vX.Y.Z, so go get @latest skips them.
      - name: Run Release Please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config-preprod.json
          manifest-file: .release-please-manifest-preprod.json
          target-branch: main
          prerelease: true
          prerelease-type: pre

  release-prod:
    name: Release Production
    if: >-
      github.event_name == 'push'
      && github.ref_name == 'prod'
      && needs.deploy.result == 'success'
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-prod
      cancel-in-progress: false
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest-prod.json
          target-branch: prod
          prerelease: false
