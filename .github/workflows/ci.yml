name: CI

on:
  push:
    # dev -> alpha, main -> preprod, prod -> prod
    branches: [dev, main, prod]
  pull_request:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to deploy once every check passes
        type: choice
        options: [alpha, preprod, prod]
        default: alpha

permissions:
  contents: read

# Only PR runs are cancellable. Killing a push mid-deploy leaves the stack in
# UPDATE_IN_PROGRESS and only a human gets it out of there.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # setup-go pins GOTOOLCHAIN=local, so this is exactly the version the `go`
      # directive asks for. Bumping it is how we pick up stdlib security fixes.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # --diff, so CI never rewrites the tree it is judging
      - name: Verify the formatting
        run: |
          go tool golangci-lint fmt --diff || {
            echo "::error::sources are not formatted. Run 'make fmt' and commit the result."
            exit 1
          }

      # godox is off by default and turned on here, same as the pre-commit hook
      # does on protected branches.
      - name: Run golangci-lint
        run: go tool golangci-lint run --enable=godox ./...

      # A module tool and not @latest: the scanner is pinned in go.mod and bumped
      # by Dependabot like everything else. The vulnerability database is fetched
      # at run time either way, so this stays as current as it was.
      - name: Check the dependencies for known vulnerabilities
        run: make vuln

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # `cover` depends on `test`, so this runs the suite and then judges it.
      # Through `make` so the floor lives in one place, the Taskfile; the
      # Makefile falls back to `go run` and this job still needs nothing but Go.
      - name: Run the unit tests and enforce the coverage floor
        run: make cover

      - name: Upload the coverage profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: .coverage/report.out
          retention-days: 7
          if-no-files-found: ignore

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # the suite creates its own table
      - name: Run the repository integration tests
        run: go test -tags=integration -count=1 ./internal/item/...

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # the flags that end up in the shipped zips live in tasks/build.yml
      - name: Compile and package both functions for Lambda (linux/arm64)
        run: make build

      - name: Upload the Lambda artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lambda-artifacts
          path: bin/dist/*.zip
          retention-days: 7

  test-e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      STAGE: ci
      ITEMS_TABLE: go-aws-serverless-starter-ci-items
      API_KEY: ci-key
      E2E_API_KEY: ci-key
      DYNAMODB_ENDPOINT: http://localhost:8000
      AWS_REGION: eu-west-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install the Playwright dependencies
        run: npm --prefix e2e ci

      - name: Type-check the test suite
        run: npm --prefix e2e run typecheck

      - name: Create the items table in DynamoDB Local
        run: go run ./tools/localdb

      # Playwright starts both functions and waits for their ports, see
      # e2e/playwright.config.ts
      - name: Run the Playwright tests
        run: npm --prefix e2e test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/reports
          retention-days: 7
          if-no-files-found: ignore

  # The spec is generated from the annotations, so it can drift.
  openapi:
    name: API Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the documentation tooling
        run: npm ci

      # regenerates and diffs; the swag invocation lives in tasks/docs.yml
      - name: Fail if the committed specification is stale
        run: make docs-check

      # --no-install: bare npx silently downloads the latest release instead of
      # failing when node_modules is missing.
      - name: Lint the specification
        run: npx --no-install redocly lint docs/openapi.yaml

      - name: Render the reference
        run: npx --no-install redocly build-docs docs/openapi.yaml -o docs/api.html

      # api.html is git-ignored, this is how you read it for a given commit
      - name: Upload the rendered reference
        uses: actions/upload-artifact@v7
        with:
          name: api-reference
          path: docs/api.html
          retention-days: 7

  infra:
    name: Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the Serverless Framework
        run: npm ci

      - name: Download the Lambda artifacts
        uses: actions/download-artifact@v8
        with:
          name: lambda-artifacts
          path: bin/dist

      # catches route collisions and unresolved variables before a deploy does
      - name: Render the CloudFormation template of every stage
        run: |
          for stage in alpha preprod prod; do
            echo "::group::$stage"
            npx --no-install serverless package --stage "$stage"
            echo "::endgroup::"
          done
        env:
          DEPLOY_API_KEY: rendered-in-ci

  # Which stage, and which version to report. Skipping this skips deploy with
  # it, so a PR never reaches AWS.
  resolve:
    name: Resolve Target
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push'
          && contains(fromJSON('["dev","main","prod"]'), github.ref_name))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      stage: ${{ steps.target.outputs.stage }}
      version: ${{ steps.target.outputs.version }}
      enabled: ${{ steps.target.outputs.enabled }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # A job and not an inline `${{ }}` because an expression has no `exit 1`,
      # and an unknown ref must fail instead of defaulting to some stage.
      - name: Resolve the stage and the version
        id: target
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.stage }}" ]; then
            stage="${{ inputs.stage }}"
          else
            case "${{ github.ref_name }}" in
            dev)  stage=alpha   ;;
            main) stage=preprod ;;
            prod) stage=prod    ;;
            *) echo "::error::no stage is mapped to ref ${{ github.ref_name }}"; exit 1 ;;
            esac
          fi

          # The version GET /health reports. We deploy before we release, so the
          # tag for this commit does not exist yet and `git describe` would only
          # ever report the previous one. The manifest already holds the new
          # version on the commit that merges a release PR.
          #
          # alpha and preprod share a manifest, dev being upstream of main.
          manifest=.release-please-manifest-preprod.json
          [ "$stage" = prod ] && manifest=.release-please-manifest-prod.json

          if [ -f "$manifest" ]; then
            base=$(jq -r '.["."]' "$manifest")
          else
            # Release Please has not been set up (or was removed downstream).
            base=0.0.0
            echo "::warning::$manifest is missing, reporting $base as the base version"
          fi

          # SemVer build metadata, ignored by precedence ordering and accepted
          # as-is in a Lambda env var.
          version="${base}+${GITHUB_SHA::7}"

          # A fresh clone has no AWS account behind it, so deploying is opt-in.
          # We still resolve, otherwise the run says nothing about what it would
          # have shipped.
          if [ "${DEPLOY_ENABLED:-}" = "true" ]; then
            enabled=true
            echo "Deploying **$stage** as \`$version\`" >> "$GITHUB_STEP_SUMMARY"
          else
            enabled=false
            echo "::notice::deployment is disabled; set the DEPLOY_ENABLED repository variable to 'true' to deploy $stage"
            {
              echo "### Deployment disabled"
              echo
              echo "\`$stage\` would have shipped as \`$version\`."
              echo
              echo "Set the \`DEPLOY_ENABLED\` repository variable to \`true\`, along"
              echo "with the \`AWS_REGION\` variable and the \`AWS_DEPLOY_ROLE_ARN\`"
              echo "secret, to deploy and release from this repository."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "stage=$stage"     >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ needs.resolve.outputs.stage }}
    # The switch `resolve` computed. An `if:` with no status function keeps the
    # implicit success() over every need, so this only narrows the gate below.
    if: needs.resolve.outputs.enabled == 'true'
    # No always() here, ever. It would only unblock the "build green, tests red"
    # case, which is exactly the one we don't want shipped: a failed deploy can
    # leave the stack in UPDATE_ROLLBACK_FAILED, and a green deploy on main
    # triggers a release. Shorten this list if dev feels slow, dont drop it.
    needs: [resolve, lint, test-unit, test-integration, openapi, build, test-e2e, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.resolve.outputs.stage }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-${{ needs.resolve.outputs.stage }}
      cancel-in-progress: false
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the Serverless Framework
        run: npm ci

      # the zips the checks ran against, not a fresh build
      - name: Download the Lambda artifacts
        uses: actions/download-artifact@v8
        with:
          name: lambda-artifacts
          path: bin/dist

      - name: Assume the deployment role through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy the stack
        run: npx --no-install serverless deploy --stage "$STAGE"
        env:
          STAGE: ${{ needs.resolve.outputs.stage }}
          VERSION: ${{ needs.resolve.outputs.version }}

  # Deploy first, release after, so a tag never points at code nobody deployed.
  #
  # Two configs and not one: both branches write a changelog and both insert at
  # the top of it, so a shared file would conflict on every release. main writes
  # CHANGELOG-preprod.md, prod writes CHANGELOG.md, manifests likewise.
  #
  # Do NOT enable auto-merge on the release PRs. A push authenticated with
  # GITHUB_TOKEN triggers no workflow, so the tagged version would never deploy.
  release-preprod:
    name: Release Preprod
    # needs.deploy.result is redundant with the implicit success(), but this is
    # where someone will look for the invariant.
    if: >-
      github.event_name == 'push'
      && github.ref_name == 'main'
      && needs.deploy.result == 'success'
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      # main carries vX.Y.Z-pre.N, which SemVer orders below the matching
      # vX.Y.Z, so `go get @latest` never picks one up.
      - name: Run Release Please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config-preprod.json
          manifest-file: .release-please-manifest-preprod.json
          target-branch: main
          prerelease: true
          prerelease-type: pre

  release-prod:
    name: Release Production
    if: >-
      github.event_name == 'push'
      && github.ref_name == 'prod'
      && needs.deploy.result == 'success'
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-prod
      cancel-in-progress: false
    steps:
      - name: Run Release Please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest-prod.json
          target-branch: prod
          prerelease: false
