name: Documentation

# Publishes the API reference built from main. docs/api.html is generated and
# git-ignored, so without this the only way to read it is a CI artifact.
#
# Needs Pages enabled: Settings > Pages > Source: GitHub Actions. Until then the
# deploy step fails.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel halfway: an interrupted deploy-pages stays in progress until it
# times out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the API reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the documentation tooling
        run: npm ci

      # Regenerated instead of read from the tree. CI already fails on the same
      # commit when the two disagree.
      - name: Regenerate the specification
        run: |
          go tool swag init --v3.1 -ot yaml --parseInternal \
            -g openapi.go \
            -d ./docs,./lambda/api/internal/handler/items,./lambda/public/internal/handler/health,./lambda/public/internal/handler/items,./internal/item,./internal/httpx \
            -o docs
          mv docs/swagger.yaml docs/openapi.yaml

      - name: Render the reference
        run: npx --no-install redocly build-docs docs/openapi.yaml -o docs/api.html

      # the reference is the whole site, so it has to be index.html
      - name: Assemble the site
        run: |
          mkdir -p site
          mv docs/api.html site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
