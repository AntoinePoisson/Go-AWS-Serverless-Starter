name: OpenAPI

# Publishes the API reference from main. api.html is generated and gitignored,
# so without this the only way to read it is a CI artifact.
#
# Needs Pages enabled (Settings > Pages > Source: GitHub Actions).
# Until then the deploy step fails.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Don't cancel halfway. An interrupted deploy-pages sits there until it times out.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the API reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install the documentation tooling
        run: npm ci

      # Regenerated, not read from the tree. CI already fails if they disagree.
      - name: Regenerate the specification and render the reference
        run: make docs
        env:
          DOCS_CANONICAL_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      # the reference is the whole site, so it has to be index.html
      - name: Assemble the site
        run: |
          mkdir -p site
          mv docs/api.html site/index.html
          cp docs/favicon.svg site/favicon.svg

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v5
